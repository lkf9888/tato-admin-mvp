name: Alert scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run alert scan
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST https://tatocar.co/api/assistant/alerts \
            -H "content-type: application/json" \
            -H "x-tato-sync-secret: ${{ secrets.GMAIL_SYNC_SECRET }}" \
            -d '{"notify":true}')
          cat /tmp/out.json
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::Alert scan returned HTTP $code"
            exit 1
          fi
