name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Launch checklist stays in sync
        run: npm run check:docs
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci-build.db"
          SESSION_SECRET: "ci-build-only-not-a-real-secret"
