name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ The schema check below needs the commit the running deploy was
          # built from, which a depth-1 clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # ⚠️ The check that was missing when v0.88.0 took the site down for an
      # hour. Everything else here proves the code compiles; this proves it
      # can start against the database that already exists.
      - name: Schema can be deployed onto the running database
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-schema-push.sh
      - name: Launch checklist stays in sync
        run: npm run check:docs
      - name: Traditional Chinese messages are regenerated
        run: npm run check:zh-hant
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci-build.db"
          SESSION_SECRET: "ci-build-only-not-a-real-secret"
