apply plugin: 'com.android.application'

android {
    namespace 'co.tatocar.app'
    compileSdkVersion 36

    defaultConfig {
        applicationId "co.tatocar.app"
        // Android 6.0. Below this the WebView is an unupdatable system
        // component on most devices, which is the one thing this app
        // cannot work around.
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 73
        versionName "0.73.0"
        resValue "string", "app_name", "TATO"
        resValue "string", "start_url", "https://tatocar.co/dashboard"
        resValue "string", "app_host", "tatocar.co"
    }

    // BuildConfig is off by default in AGP 8; the activity reads
    // VERSION_NAME from it to tag the user agent.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Left unminified on purpose. There is one Activity and no
            // library surface worth shrinking; R8 here would buy a few
            // KB in exchange for a stack trace nobody can read.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin folded `kotlin-stdlib-jdk7` and `-jdk8` into `kotlin-stdlib`
// in 1.8. Some transitive dependency here still asks for the 1.6.21
// split artifacts, and having both on the classpath fails the build
// with several hundred duplicate-class lines that name every class in
// the overlap and nothing about the cause.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
}
