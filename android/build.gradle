// Top-level build file.
//
// `jcenter()` is deliberately absent: it is read-only since 2021 and
// the bubblewrap template that used to be here still listed it, which
// costs a failed lookup on every dependency resolution.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
