name: Walkaround
options:
  bundleIdPrefix: co.tatocar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  EvidenceCore:
    path: EvidenceCore

targets:
  Walkaround:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: EvidenceCore
    settings:
      base:
        # ⚠️ Left as `evidence` although the app is now called Walkaround.
        # A bundle id is not user-visible, and changing it would install a
        # second, empty copy beside the first rather than replacing it --
        # orphaning every walk-around already archived in the old container.
        PRODUCT_BUNDLE_IDENTIFIER: co.tatocar.evidence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pinned here rather than picked in Xcode's UI: the .xcodeproj is
        # generated, so a team chosen in the UI is wiped by the next
        # `xcodegen generate` and signing silently breaks.
        DEVELOPMENT_TEAM: VW85832VF2
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPhone only. Every device in the fleet is an iPhone 14 or newer,
        # and a guided walk-around is not a thing anyone does on an iPad.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Walkaround
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Written for the App Store reviewer as much as for staff: the reason
        # this app wants a location is that a claim photo without one is
        # rejected unread.
        NSCameraUsageDescription: >-
          Photographs of the vehicle's condition are taken with the camera.
        NSLocationWhenInUseUsageDescription: >-
          Each photo records where it was taken. Insurance claims reject
          photographs whose metadata has no location.
        # The motion sensor now does two jobs, and a purpose string that
        # names only one of them is the kind App Review sends back.
        NSMotionUsageDescription: >-
          Motion sensors detect camera shake, so you are asked to retake a
          photo before it is too blurred to prove anything, and note which
          way each photo faces, so the app can suggest which side of the car
          is still to be photographed.
        # Claims are filed from the Turo app, whose picker reads the photo
        # library and nothing else, so every photograph is copied there as it
        # is taken. Read access is what lets the app check that the library
        # handed it back unaltered.
        #
        # ⚠️ This is the source of truth. `xcodegen generate` rewrites
        # Sources/Info.plist from these lines, so an edit made to the plist
        # alone is silently reverted by the next generate -- which is exactly
        # what happened to this string once.
        NSPhotoLibraryAddUsageDescription: >-
          Each photo is copied into an album as it is taken, so you can attach
          them to a Turo claim even if you stop part-way.
        NSPhotoLibraryUsageDescription: >-
          Photos are read back after saving to confirm the system did not
          re-encode them, which would invalidate them as evidence.
        # Lets the app reach a dev server on the same wifi over plain http
        # (http://192.168.x.x:3000), which is how the upload path gets
        # tested before there is a real server to point at. This key only
        # covers local addresses -- App Transport Security still applies in
        # full to anything on the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
